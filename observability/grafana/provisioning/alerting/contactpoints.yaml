apiVersion: 1

contactPoints:
  - orgId: 1
    name: mastra-webhook
    receivers:
      - uid: mastra-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://host.docker.internal:14111/webhooks/grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $GRAFANA_WEBHOOK_SECRET
